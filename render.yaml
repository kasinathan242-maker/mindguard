version: "1"

databases:
  - name: mindguard-db
    databaseName: mindguard
    user: mindguard
    plan: free
    region: oregon

services:
  # 1. FastAPI Backend Service (Docker)
  - type: web
    name: mindguard-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: custom
      - key: SAFETY_CLASSIFIER
        value: hashed
      - key: EMOTION_ENABLED
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mindguard-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: JWT_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://mindguard-app.onrender.com,https://mindguard.onrender.com

  # 2. React 19 Frontend Web Client (Static Site on CDN)
  - type: web
    name: mindguard-app
    runtime: static
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://mindguard-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
