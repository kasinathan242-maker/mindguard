# Context that changes the level of a match. All are matched against normalised text.
modifiers:
  # Removed from the text before any rule runs: idioms that use death words without meaning them.
  benign:
    - '\bdying\s+(?:to|for)\b'
    - '\b(?:die|died|dying|dead)\s+(?:of|from|with)\s+(?:embarrassment|boredom|laughter|laughing|shame|cringe|hunger|heat|cold|curiosity|excitement)\b'
    - '\bdead\s+(?:tired|serious|sure|battery|phone|laptop|wifi|end|beat|silent|quiet|on\s+time)\b'
    - '\b(?:phone|laptop|battery|wifi|internet|charger|plant|plants|car|bike|scooter|torch|mic|speaker)\s+(?:is\s+|was\s+|has\s+|just\s+)?(?:dead|died|dying)\b'
    - '\bdeadlines?\b|\bdead\s+line\b'
    - '\bto\s+die\s+for\b'
    - '\b(?:the\s+)?death\s+of\s+me\b'
    - '\b(?:who|that)\s+(?:died|passed\s+away)\b'
    - '\b(?:end|ending|cancel)\s+(?:my|the|this|our)\s+(?:subscription|membership|contract|plan|call|meeting|conversation|relationship|argument|streak|lease)\b'
  # Within the same clause and BEFORE the match: urgent -> elevated.
  negation_before:
    - '\b(?:would|will|could)\s+never\b'
    - '\bnever\s+(?:would|will|going\s+to|ever)\b'
    - '\b(?:am|is|are)\s+not\s+(?:going\s+to|planning\s+to)\b'
    - '\b(?:will|would)\s+not\b'
    - '\bdo\s+not\s+(?:want|wish|plan|intend|actually\s+want|really\s+want)\b'
    - '\bno\s+(?:intention|intentions|plan|plans|thoughts)\s+(?:of|to)\b'
    - '\bnot\s+(?:that\s+)?i\s+(?:want|would)\b'
    - '\bnever\s+want\s+to\b'
    # Negation immediately before the matched phrase: "not planning to die", "not that i want to die".
    - '\bnot\s+(?:really\s+|actually\s+|even\s+)?$'
    - '\bnot\s+that\s+i\s*$'
  # Directly AFTER the match (Tamil and Tanglish put negation after the verb): urgent -> elevated.
  negation_after:
    - '^\s*(?:மாட்டேன்|மாட்டேன|மாட்டோம்)'
    - '^\s*(?:maaten|maatten|matten|maten|mateen|maatom)\b'
    - '^\s*(?:னு|ன்னு)\s*(?:இல்ல|இல்லை)'
    - '^\s*(?:nu|nnu)\s*(?:illa|illai)\b'
  # Within the same clause and BEFORE the match: someone else is the subject. urgent -> elevated.
  third_party:
    - '\b(?:my|a|our|his|her|their)\s+(?:friend|friends|best\s+friend|roommate|room\s+mate|brother|sister|cousin|classmate|batchmate|mom|mum|mother|dad|father|amma|appa|anna|akka|thambi|thangachi|girlfriend|boyfriend|bf|gf|colleague|neighbou?r|student|junior|senior|uncle|aunt)\b'
    - '\b(?:he|she|they|someone|somebody|people|a\s+person|a\s+guy|a\s+girl)(?:\s+\w+){0,4}?\s+(?:said|says|say|told|tells|wants?|wanted|is|was|were|keeps|kept|posted|texted|messaged|might|tried|has\s+been|talking|talked)\b'
    - '\bhow\s+(?:do|can|should)\s+i\s+help\b'
    - '\bif\s+(?:someone|somebody|a\s+friend|a\s+person)\b'
    - '(?:என்\s*(?:நண்பன்|நண்பி|தோழி|தோழன்|தம்பி|தங்கை|அக்கா|அண்ணா|அண்ணன்|அம்மா|அப்பா)|அவன்|அவள்|அவங்க)'
    - '\b(?:en\s+(?:friend|nanban|nanbi|thozhi|thambi|akka|anna|thangachi|roommate)|avan|aval|avanga|avaru)\b'
  # Directly AFTER the match: reported speech ("...-nu sonnan", "...னு சொன்னான்"). urgent -> elevated.
  reported_speech_after:
    - '^\s*(?:னு|ன்னு)\s*(?:சொல்றான்|சொன்னான்|சொல்றா|சொன்னா|சொல்றாங்க|சொன்னாங்க|சொல்லுறான்)'
    - '^\s*(?:nu|nnu)\s*(?:sonnan|sonnaan|sonna|solran|solraan|solra|sollura|solluran|sonnanga|solranga|text\s+panna|text\s+pannan|post\s+pannan)\b'
  # Anywhere in the message: the words belong to a song, film, book or story. urgent -> elevated.
  quotation:
    - '\b(?:lyrics?|song|songs|singing|sang|sings|chorus|verse|quote|quoting|quoted|movie|film|scene|dialogue|dialog|book|novel|poem|poetry|character|episode|series|web\s+series|story|anime|manga|meme|rap|bgm)\b'
    - '(?:பாடல்|பாட்டு|படம்|படத்துல|வசனம்|கதை)'
    - '\b(?:paattu|paatu|padam|padathula|vasanam)\b'
  # Anywhere in the message: the subject is research, news or study. urgent -> elevated, and
  # elevated "topic" matches -> none.
  informational:
    # Deliberately excludes "study", "exam", "assignment" and "project": students in real
    # distress talk about those, and they must never soften an urgent message.
    - '\b(?:rates?|statistics?|stats|research|studies|article|articles|news|essay\s+on|seminar\s+on|awareness|prevention|helpline\s+numbers?|psychology\s+(?:class|lecture|paper)|psych\s+class|data\s+on|report\s+on|survey|ncrb|who\s+report|journalism|documentary)\b'
  # Anywhere in the message: laughter or joking. urgent -> elevated, and elevated matches of
  # `hyperbole: true` rules -> none.
  hyperbole:
    - '\b(?:lol|lmao|lmfao|rofl|haha\w*|hehe\w*|jk|just\s+kidding|kidding|joking|xd|ded)\b'
  # Anywhere in the message: the person says they are serious. Cancels `hyperbole`.
  sincerity:
    - '\b(?:seriously|not\s+joking|not\s+kidding|no\s+joke|i\s+mean\s+it|for\s+real|serious\s+ah|honestly\s+serious)\b'
  # Anywhere in the message: ordinary stress that people exaggerate about. Only drops elevated
  # `hyperbole: true` matches to none; never touches urgent ones (exam stress is a real risk).
  everyday_stress:
    - '\b(?:exam|exams|test|tests|class|lecture|assignment|homework|traffic|heat|boss|manager|maths?|physics|chemistry|lab|record|viva|semester|internals|deadline|meeting|monday|queue|mosquito|mosquitoes|wifi|internet|network|commute|bus|metro|power\s+cut)\b'
    - '\b(?:saavadikk?\w*|saagadichu\w*|saagadikk?\w*|kolraanga|kollraanga|torture)\b'
  # Within the same clause: the thought is described as past and resolved. urgent -> elevated.
  remission:
    - '\bused\s+to\b'
    - '\b(?:years|months)\s+ago\b'
    - '\bwhen\s+i\s+was\s+(?:younger|a\s+kid|a\s+child|in\s+school|in\s+(?:\d+|\w+)\s+(?:std|standard|grade|class))\b'
    - '\b(?:i\s+am|feeling)\s+(?:doing\s+)?(?:much\s+|a\s+lot\s+)?better\s+now\b'
    - '\bno\s+longer\s+(?:feel|think|want)\b'
    - '\bnot\s+anymore\b'
