[project]
name = "mindguard-api"
version = "0.1.0"
description = "MindGuard AI backend: validated screening, safety engine and emotion-aware support chat."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.151,<0.152",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32,<0.33",
    "alembic>=1.20,<2",
    "redis>=8.1,<9",
    "pyjwt>=2.15,<3",
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.3,<3",
    "pyyaml>=6.0,<7",
    "torch>=2.14,<3",
    "transformers>=5.20,<6",
    "cryptography>=46",
    "httpx>=0.28,<0.29",
    "reportlab>=4.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.28,<0.29",
    "asgi-lifespan>=2.1,<3",
    "aiosqlite>=0.22,<0.23",
    "fakeredis>=2.32,<3",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "pip-audit>=2.10,<3",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "TID"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
exclude = ["app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "asgi_lifespan.*", "transformers.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["model: needs the downloaded sentence-encoder weights (skipped when absent)"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
