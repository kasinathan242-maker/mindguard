[project]
name = "mindguard-ml"
version = "0.1.0"
description = "Training and evaluation for MindGuard AI's safety classifier and emotion models."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14,<3",
    "numpy>=2.3,<3",
    # The training scripts import the API's featuriser, which needs these.
    "pydantic>=2.14,<3",
    "pyyaml>=6.0,<7",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
