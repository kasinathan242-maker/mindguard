name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mindguard
          POSTGRES_PASSWORD: mindguard
          POSTGRES_DB: mindguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mindguard" --health-interval 5s --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Cache the safety classifier's sentence encoder
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-e5-small-614241f6
      - run: uv run python -m app.safety.download_models
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Safety release gate (rules + embedding classifier, urgent recall >= 0.95)
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run python ../../ml/safety_eval/evaluate.py --gate
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql+asyncpg://mindguard:mindguard@localhost:5432/mindguard
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --progress-spinner off

  web:
    name: Web (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  compose:
    name: Docker Compose stack + E2E
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      # E2E creates many sessions from one IP in a minute; production keeps the default of 30.
      - run: cp .env.example .env && sed -i 's/^AUTH_RATE_LIMIT_PER_MINUTE=.*/AUTH_RATE_LIMIT_PER_MINUTE=300/' .env
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: curl --fail --silent http://localhost:8080/api/v1/health | tee /dev/stderr | grep -q '"status":"ok"'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: End-to-end tests (Playwright + axe-core)
        working-directory: apps/web
        run: |
          npm ci --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
